name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: pip

    - name: Install dependencies
      run: python -m pip install -r requirements-ci.txt

    - name: Check code style
      run: python -m flake8 --ignore=E501 django_models test-django-project

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django-version: "Django>=5.0,<5.1"
          - python-version: "3.11"
            django-version: "Django>=5.1,<5.2"
          - python-version: "3.12"
            django-version: "Django>=5.2,<6.0"
          - python-version: "3.13"
            django-version: "Django>=5.2,<6.0"
          - python-version: "3.14"
            django-version: "Django>=5.2,<6.0"
          - python-version: "3.12"
            django-version: "Django>=6.0,<6.1"
          - python-version: "3.13"
            django-version: "Django>=6.0,<6.1"
          - python-version: "3.14"
            django-version: "Django>=6.0,<6.1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install -r requirements-ci.txt
        python -m pip install "${{ matrix.django-version }}"

    - name: Run tests
      run: python -m pytest --cov-branch --cov-report=xml --maxfail=2

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.14' && matrix.django-version == 'Django>=6.0,<6.1'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: true

    - name: Upload coverage artifact
      if: matrix.python-version == '3.14' && matrix.django-version == 'Django>=6.0,<6.1'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
